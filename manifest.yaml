name: selfmedia-community-answer-drafts-cn
slug: selfmedia-community-answer-drafts-cn
display_name: 社区问题回复草稿
description: 接收最多20条脱敏读者问题、最多5000字已批准知识材料或政策来源及语气，产出逐题可复制的社区回复草稿与可追溯依据；适用于创作者整理内容问答。材料不足时明确列出需补充字段，不推测事实，也不执行采集、发送或账号管理。
version: 1.0.0
icon: icon-512.png
license: MIT
tags:
  - 自媒体
  - 社区运营
  - 内容创作
  - 回复草稿
  - 事实核验
trigger_words:
  - 社区问题回复
  - 读者问答草稿
  - 评论回复文案
interface:
  display_name: 社区问题回复草稿
  short_description: 根据已批准知识材料起草可核验且可直接复制的社区问答回复
  default_prompt: 使用 $selfmedia-community-answer-drafts-cn，根据我提供的脱敏读者问题、批准材料和语气，逐题写回复草稿并标明依据；没有依据时列出需补充字段。
  icon_small: icon-512.png
  icon_large: icon-512.png
self_test: node scripts/self-test.mjs
